name: Generate Materials Index

on:
  push:
    paths:
      - 'materials/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate index.json
        run: |
          python3 -c "
          import os, json
          data = {}
          base = 'materials'
          if not os.path.exists(base): os.makedirs(base)
          
          for subject in sorted(os.listdir(base)):
              sub_path = os.path.join(base, subject)
              if os.path.isdir(sub_path):
                  subject_display = subject.replace('_', ' ')
                  data[subject_display] = {'Lectures': {}, 'Sections': {}, 'Exams': []}
                  
                  for category in os.listdir(sub_path):
                      cat_path = os.path.join(sub_path, category)
                      if os.path.isdir(cat_path):
                          if category in ['Lectures', 'Sections']:
                              for person in sorted(os.listdir(cat_path)):
                                  person_path = os.path.join(cat_path, person)
                                  if os.path.isdir(person_path):
                                      person_display = person.replace('_', ' ')
                                      files = [f for f in os.listdir(person_path) if os.path.isfile(os.path.join(person_path, f)) and not f.startswith('.')]
                                      data[subject_display][category][person_display] = [os.path.join(cat_path, f).replace('\\\\', '/') for f in files]
                          elif category == 'Exams':
                              files = [f for f in os.listdir(cat_path) if os.path.isfile(os.path.join(cat_path, f)) and not f.startswith('.')]
                              data[subject_display]['Exams'] = [os.path.join(cat_path, f).replace('\\\\', '/') for f in files]
                              
          with open('index.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          "

      - name: Commit and push index.json
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add index.json
          git diff --staged --quiet || git commit -m "🤖 Auto-update materials index"
          git push
